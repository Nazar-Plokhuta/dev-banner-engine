<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dev Banner Engine</title>
<style>
  :root {
    --canvas: #0B0F14;
    --surface: #121821;
    --text: #E8EEF5;
    --muted: #8B9BB0;
    --accent: #3B82F6;
    --border: #1E293B;
    --font: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--canvas); color: var(--text);
    font-family: var(--font); line-height: 1.5;
  }
  main {
    display: grid; grid-template-columns: minmax(280px, 360px) 1fr; gap: 24px;
    max-width: 1440px; margin: 0 auto; padding: 32px;
  }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; padding: 16px; } }
  section {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px;
  }
  h1 { margin: 0 0 4px; font-size: 20px; }
  .sub { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
  label { display: block; margin-bottom: 16px; color: var(--muted); font-size: 13px; }
  input, select {
    display: block; width: 100%; margin-top: 6px; padding: 10px 12px;
    background: var(--canvas); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; font: inherit; font-size: 15px;
  }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    width: 100%; padding: 10px 14px; background: var(--accent); color: var(--text);
    border: 1px solid var(--accent); border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: progress; }
  .preview {
    display: flex; align-items: center; justify-content: center; min-height: 240px;
    background: var(--canvas); border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
  }
  .preview img { display: block; width: 100%; height: auto; }
  #status { min-height: 1.5em; margin: 12px 0 0; color: var(--muted); font-size: 13px; }
  #status.error { color: var(--text); }
  #status.error::before { content: "\25A0 "; color: var(--accent); }
</style>
</head>
<body>
<main>
  <section aria-label="Banner settings">
    <h1>Dev Banner Engine</h1>
    <p class="sub">Edit a field to refresh the preview.</p>
    <form id="form" autocomplete="off">
      <label>Title
        <input id="title" name="title" maxlength="60" value="Dev Banner Engine">
      </label>
      <label>Tagline
        <input id="tagline" name="tagline" maxlength="120" value="Deterministic banners for engineers">
      </label>
      <label>Chips (comma-separated)
        <input id="chips" name="chips" value="Python, FastAPI, Pydantic">
      </label>
      <label>Preset
        <select id="preset" name="preset">
          <option value="github-og">github-og (1280x640)</option>
          <option value="upwork-card">upwork-card (1200x900)</option>
        </select>
      </label>
      <label>Author
        <input id="author" name="author" value="Nazar-Plokhuta">
      </label>
      <button type="button" id="download">Download PNG</button>
    </form>
  </section>
  <section aria-label="Preview">
    <div class="preview"><img id="preview" alt="Banner preview" hidden></div>
    <p id="status" role="status"></p>
  </section>
</main>
<script>
  const DEBOUNCE_MS = 300;
  const form = document.getElementById("form");
  const preview = document.getElementById("preview");
  const status = document.getElementById("status");
  const downloadButton = document.getElementById("download");
  let timer = null;
  let requestId = 0;
  let previewUrl = null;

  function readConfig() {
    const data = new FormData(form);
    return {
      title: data.get("title"),
      tagline: data.get("tagline"),
      chips: data.get("chips").split(",").map((c) => c.trim()).filter(Boolean),
      preset: data.get("preset"),
      author: data.get("author"),
    };
  }

  async function post(path) {
    return fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(readConfig()),
    });
  }

  async function describeError(response) {
    try {
      const body = await response.json();
      if (Array.isArray(body.detail)) {
        return body.detail.map((d) => `${d.loc.slice(1).join(".")}: ${d.msg}`).join(" | ");
      }
      return String(body.detail);
    } catch {
      return `Request failed (${response.status})`;
    }
  }

  function setStatus(message, isError) {
    status.textContent = message;
    status.className = isError ? "error" : "";
  }

  async function refresh() {
    const current = ++requestId;
    try {
      const response = await post("/api/render/svg");
      if (current !== requestId) return;
      if (!response.ok) {
        setStatus(await describeError(response), true);
        return;
      }
      const blob = await response.blob();
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = URL.createObjectURL(blob);
      preview.src = previewUrl;
      preview.hidden = false;
      setStatus("", false);
    } catch {
      if (current === requestId) setStatus("Preview service is unreachable.", true);
    }
  }

  form.addEventListener("input", () => {
    clearTimeout(timer);
    timer = setTimeout(refresh, DEBOUNCE_MS);
  });

  downloadButton.addEventListener("click", async () => {
    downloadButton.disabled = true;
    try {
      const response = await post("/api/render/png");
      if (!response.ok) {
        setStatus(await describeError(response), true);
        return;
      }
      const disposition = response.headers.get("Content-Disposition") || "";
      const match = /filename="([^"]+)"/.exec(disposition);
      const url = URL.createObjectURL(await response.blob());
      const link = document.createElement("a");
      link.href = url;
      link.download = match ? match[1] : "banner.png";
      link.click();
      URL.revokeObjectURL(url);
    } catch {
      setStatus("Preview service is unreachable.", true);
    } finally {
      downloadButton.disabled = false;
    }
  });

  refresh();
</script>
</body>
</html>
